on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: app-bauen
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pakete installieren
        run: npm install --no-audit --no-fund

      - name: Bibliotheken einbinden
        run: |
          mkdir -p www/lib
          cp node_modules/jsqr/dist/jsQR.js www/lib/jsQR.js
          cp node_modules/qrcode-generator/qrcode.js www/lib/qrcode.js

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/de/kleinkram/app
          cp native/*.java android/app/src/main/java/de/kleinkram/app/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/android/* android/app/src/main/res/
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK signieren
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Signierschlüssel fehlt (Secret KEYSTORE_B64)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > key.jks; PASS="$KEYSTORE_PASS"
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks key.jks --ks-pass "pass:$PASS" --ks-key-alias kleinkram --out Kleinkram.apk aligned.apk
          "$BT/apksigner" verify Kleinkram.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Kleinkram 1.${{ github.run_number }}
          body: "Zum Installieren: Kleinkram.apk auf dem Handy herunterladen und öffnen."
          files: Kleinkram.apk
          make_latest: true

      - name: Web-App vorbereiten
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
